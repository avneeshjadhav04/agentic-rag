[supervisord]
nodaemon=true
logfile=/app/supervisord.log
pidfile=/app/supervisord.pid
user=root

[program:backend]
command=/app/.venv/bin/uvicorn app.main:app --host 0.0.0.0 --port %(ENV_BACKEND_PORT)s --app-dir /app/backend
directory=/app/backend
autostart=true
autorestart=true
stdout_logfile=/app/logs/backend.log
stderr_logfile=/app/logs/backend.err.log
redirect_stderr=false
priority=1

[program:frontend]
command=/app/scripts/start-frontend.sh
environment=HOSTNAME="0.0.0.0",PORT="%(ENV_PORT)s"
directory=/app/frontend
autostart=true
autorestart=true
stdout_logfile=/app/logs/frontend.log
redirect_stderr=true
priority=2

